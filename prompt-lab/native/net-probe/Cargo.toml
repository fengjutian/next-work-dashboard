[package]
name = "nwd-net-probe"
version = "0.1.0"
edition = "2021"
description = "Network probe daemon for next-work-dashboard (Network Observatory plugin)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
hickory-resolver = "0.24"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
