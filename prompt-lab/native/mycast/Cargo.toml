[package]
name = "nwd-mycast"
version = "0.1.0"
edition = "2021"
description = "MyCast: 局域网手机投屏 + 文件传输 sidecar (HTTP + WebSocket + mDNS) for prompt-lab."

[dependencies]
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
mdns-sd = "0.11"
rand = "0.8"
url = "2"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
