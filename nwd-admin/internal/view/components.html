{{define "head"}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NWD 插件分发服务，为 next-work-dashboard 提供安全、统一的插件发现与下载能力。">
<title>NWD Plugin Hub</title>
<style>
    :root { color-scheme: light; --bg:#f7f7fb; --surface:#fff; --surface-2:#f1f0f7; --text:#1f1b2d; --muted:#716b80; --line:#e6e2ec; --primary:#6d3df0; --primary-dark:#5728d2; --primary-soft:#eee9ff; --danger:#c9364e; --shadow:0 18px 50px rgba(49,35,83,.09); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; min-width:320px; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { flex:1; }
    a { color:inherit; text-decoration:none; }
    button,input { font:inherit; }
    .shell { width:min(1160px,calc(100% - 40px)); margin-inline:auto; }
    .nav { position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(230,226,236,.85); background:rgba(255,255,255,.88); backdrop-filter:blur(18px); }
    .nav-inner { min-height:68px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:17px; font-weight:750; letter-spacing:-.02em; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; color:white; background:linear-gradient(145deg,#8057f7,#5527d6); box-shadow:0 8px 20px rgba(109,61,240,.26); }
    .nav-links { display:flex; align-items:center; gap:8px; }
    .nav-link { padding:8px 12px; border-radius:9px; color:var(--muted); font-size:14px; font-weight:600; }
    .nav-link:hover { color:var(--primary); background:var(--primary-soft); }
    .hero { position:relative; overflow:hidden; padding:92px 0 70px; }
    .hero:before { content:""; position:absolute; width:620px; height:620px; left:50%; top:-390px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle,rgba(128,87,247,.22),rgba(128,87,247,0) 68%); pointer-events:none; }
    .hero-grid { position:relative; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr); align-items:center; gap:64px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:6px 11px; border:1px solid #dcd2ff; border-radius:999px; color:var(--primary); background:rgba(238,233,255,.72); font-size:12px; font-weight:750; letter-spacing:.08em; text-transform:uppercase; }
    h1 { max-width:760px; margin:22px 0 18px; font-size:clamp(40px,6vw,68px); line-height:1.05; letter-spacing:-.055em; }
    .gradient-text { color:var(--primary); background:linear-gradient(105deg,#7345ed,#a34fe0); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .lead { max-width:680px; margin:0; color:var(--muted); font-size:18px; line-height:1.8; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 18px; border:1px solid var(--line); border-radius:11px; background:var(--surface); color:var(--text); font-weight:700; cursor:pointer; transition:.18s ease; }
    .btn:hover { transform:translateY(-1px); border-color:#cfc6de; box-shadow:0 8px 24px rgba(49,35,83,.08); }
    .btn-primary { border-color:var(--primary); color:#fff; background:var(--primary); box-shadow:0 10px 24px rgba(109,61,240,.22); }
    .btn-primary:hover { border-color:var(--primary-dark); background:var(--primary-dark); }
    .endpoint-card { padding:26px; border:1px solid var(--line); border-radius:22px; background:rgba(255,255,255,.86); box-shadow:var(--shadow); }
    .endpoint-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .status { display:flex; align-items:center; gap:8px; color:#258559; font-size:13px; font-weight:700; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:#32b978; box-shadow:0 0 0 5px rgba(50,185,120,.12); }
    .code-row { padding:14px 15px; border:1px solid var(--line); border-radius:11px; background:#faf9fc; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; }
    .code-row + .code-row { margin-top:10px; }
    .method { margin-right:9px; color:#258559; font-weight:800; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; padding-bottom:76px; }
    .stat { padding:24px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
    .stat-value { font-size:30px; line-height:1.15; font-weight:800; letter-spacing:-.04em; }
    .stat-label { margin-top:5px; color:var(--muted); font-size:13px; }
    .section { padding:0 0 78px; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .section-title { margin:0; font-size:27px; letter-spacing:-.035em; }
    .section-copy { margin:4px 0 0; color:var(--muted); }
    .text-link { color:var(--primary); font-weight:700; }
    .plugin-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .plugin-card { display:flex; align-items:flex-start; gap:15px; padding:20px; border:1px solid var(--line); border-radius:16px; background:var(--surface); transition:.18s ease; }
    .plugin-card:hover { transform:translateY(-2px); border-color:#cfc3ef; box-shadow:0 13px 35px rgba(49,35,83,.08); }
    .plugin-icon { flex:0 0 44px; width:44px; height:44px; display:grid; place-items:center; border-radius:13px; background:var(--primary-soft); font-size:22px; }
    .plugin-body { min-width:0; flex:1; }
    .plugin-name { font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .plugin-desc { min-height:42px; margin:3px 0 10px; color:var(--muted); font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .meta { display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--muted); font-size:12px; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .step { padding:23px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
    .step-no { width:31px; height:31px; display:grid; place-items:center; margin-bottom:18px; border-radius:10px; color:var(--primary); background:var(--primary-soft); font-weight:800; }
    .step h3 { margin:0 0 5px; font-size:16px; }
    .step p { margin:0; color:var(--muted); font-size:13px; }
    code { padding:2px 6px; border-radius:6px; color:#5633b5; background:var(--primary-soft); font:12px ui-monospace,SFMono-Regular,Consolas,monospace; }
    .admin-page { padding:46px 0 72px; }
    .page-head { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:24px; }
    .page-head h1 { margin:0; font-size:32px; letter-spacing:-.04em; }
    .panel { border:1px solid var(--line); border-radius:17px; background:var(--surface); box-shadow:0 8px 26px rgba(49,35,83,.04); }
    .upload-panel { padding:24px; margin-bottom:20px; }
    .hidden { display:none !important; }
    .field-label { display:block; margin-bottom:8px; font-size:13px; font-weight:750; }
    .file-input { width:100%; padding:10px; border:1px dashed #cfc6dc; border-radius:12px; color:var(--muted); background:#faf9fc; }
    .form-help { margin:8px 0 0; color:var(--muted); font-size:12px; }
    .form-actions { display:flex; gap:10px; margin-top:18px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; font-size:13px; }
    th { padding:13px 16px; color:var(--muted); background:var(--surface-2); text-align:left; font-weight:700; }
    td { padding:15px 16px; border-top:1px solid var(--line); color:var(--muted); }
    tbody tr:hover { background:#fbfaff; }
    .plugin-cell { display:flex; align-items:center; gap:10px; }
    .plugin-cell strong { display:block; color:var(--text); }
    .plugin-cell small { display:block; }
    .actions-cell { text-align:right; white-space:nowrap; }
    .danger-link { border:0; color:var(--danger); background:transparent; cursor:pointer; }
    .empty { padding:64px 20px; text-align:center; color:var(--muted); }
    .empty-icon { font-size:34px; }
    footer { padding:25px 20px; border-top:1px solid var(--line); color:var(--muted); text-align:center; font-size:12px; }
    @media (max-width:820px) { .hero { padding-top:65px; } .hero-grid { grid-template-columns:1fr; gap:34px; } .endpoint-card { max-width:560px; } .steps { grid-template-columns:1fr; } }
    @media (max-width:640px) { .shell { width:min(100% - 28px,1160px); } .nav-inner { min-height:60px; } .brand span:last-child { display:none; } .nav-link { padding:7px 9px; } .hero { padding:48px 0 50px; } h1 { font-size:40px; } .lead { font-size:16px; } .actions .btn { flex:1; } .stats { grid-template-columns:1fr; gap:10px; padding-bottom:58px; } .stat { padding:18px 20px; } .plugin-grid { grid-template-columns:1fr; } .section { padding-bottom:58px; } .section-head,.page-head { align-items:flex-start; } .page-head { flex-direction:column; } }
</style>
{{end}}

{{define "nav"}}
<nav class="nav">
    <div class="shell nav-inner">
        <a href="/" class="brand" aria-label="NWD Plugin Hub 首页"><span class="brand-mark">N</span><span>NWD Plugin Hub</span></a>
        <div class="nav-links">
            <a href="/" class="nav-link">首页</a>
            <a href="/plugins" class="nav-link">插件管理</a>
            <a href="/api/plugins" class="nav-link">API</a>
        </div>
    </div>
</nav>
{{end}}

{{define "footer"}}
<footer>NWD Plugin Hub · {{.Version}} · 为 next-work-dashboard 提供插件分发服务</footer>
{{end}}
