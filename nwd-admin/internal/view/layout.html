<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NWD Admin — 插件管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#8b5cf6', hover: '#7c3aed', light: '#ede9fe', muted: '#ddd6fe', fg: '#ffffff' },
                        bg:      '#faf9fb',
                        card:    '#ffffff',
                        border:  '#e4e0ee',
                        muted:   '#f3f1f8',
                        mutedfg: '#6d6880',
                        fg:      '#1e1b2e',
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #faf9fb; color: #1e1b2e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Nav -->
    <nav class="bg-card border-b border-border px-6 py-3 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 font-semibold text-lg text-fg no-underline">
            <span class="text-2xl">🧩</span> NWD Admin
        </a>
        <div class="flex items-center gap-4 text-sm text-mutedfg">
            <a href="/" class="hover:text-primary transition-colors">首页</a>
            <a href="/plugins" class="hover:text-primary transition-colors">插件管理</a>
        </div>
    </nav>

    <!-- Main -->
    <main class="flex-1">
        {{template "content" .}}
    </main>

    <!-- Footer -->
    <footer class="border-t border-border px-6 py-4 text-center text-xs text-mutedfg">
        NWD Admin · Go {{.Version}} · 为 next-work-dashboard 提供插件分发服务
    </footer>
</body>
</html>
