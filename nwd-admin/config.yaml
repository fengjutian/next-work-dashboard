# nwd-admin config — override via env vars: SERVER_ADDR, LOG_LEVEL, etc.
server:
  addr: ":8090"
  read_timeout: 5
  write_timeout: 10
  idle_timeout: 120

  # Optional TLS termination. Leave enabled=false to serve plain
  # HTTP. Two mutually exclusive modes are supported:
  #
  #   static: a PEM-encoded cert+key pair on disk. Suitable for
  #           any CA-issued cert (Let's Encrypt via certbot, an
  #           internal PKI, etc.) and for local development with
  #           a self-signed pair from `nwd-admin gen-cert`.
  #
  #   acme:   on-the-fly Let's Encrypt certificates via autocert.
  #           Requires the binary to be reachable on port 80 for
  #           the http-01 challenge. Set redirect_http=true to
  #           have :80 308-redirect every non-challenge request
  #           to the HTTPS port.
  tls:
    enabled: false
    cert_file: ""                # static mode
    key_file: ""                 # static mode
    min_version: "1.2"           # 1.2 or 1.3 (static only)
    redirect_http: false         # acme mode only
    acme:
      hosts: []                  # e.g. ["nwd-admin.example.com"]
      cache_dir: ""              # default "<data_dir>/acme-cache"
      email: ""                  # contact for Let's Encrypt account
      staging: false             # use Let's Encrypt staging (test only)

  # CSRF guard for write endpoints (POST/DELETE). Defaults:
  #   - enabled (disable=false)
  #   - require_custom_header=true (X-Requested-With: nwd-admin)
  #   - allowed_origins derived from server.addr when empty
  csrf:
    disable: false
    allowed_origins: []          # e.g. ["nwd-admin.example.com"]
    require_custom_header: true  # omit to default to true

database:
  data_dir: "./data"

log:
  level: "info"   # debug | info | warn | error
  format: "json"  # json | text

# Admin authentication. Leave both username and password_hash empty
# to run in trusted-local mode (write endpoints are unprotected).
# As soon as either field is set, the server requires the matching
# pair — a half-configured admin is refused at startup.
#
# Generate the password_hash with:
#   nwd-admin gen-password
admin:
  username: ""                                  # e.g. "admin"
  password_hash: ""                             # bcrypt hash from `gen-password`
  realm: "nwd-admin"                            # Basic auth realm

# Per-IP token-bucket rate limits. Set a class's rate to 0 to
# disable throttling for that traffic. The defaults are tuned for
# "annoying enough to deter casual abuse, generous enough to keep
# interactive use smooth".
rate_limit:
  read:                          # public pages, JSON listing, download
    rate: 60.0                   # sustained requests / second / IP
    burst: 30                    # max burst before rate limit applies
  write:                         # POST/DELETE write endpoints
    rate: 5.0
    burst: 5
  admin:                         # /audit page and /api/audit-logs
    rate: 30.0
    burst: 10

# Audit log. When disable=true the recorder becomes a no-op and
# no rows are written. retention_days controls how long rows are
# kept; a background goroutine prunes older rows every hour.
audit:
  disable: false
  retention_days: 90

