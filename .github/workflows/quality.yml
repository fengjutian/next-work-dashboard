name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prompt-lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prompt-lab/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check knowledge health
        run: npm run knowledge:check -- --format github --min-score 70
      - name: Report knowledge impact
        run: npm run knowledge:impact -- --format github
